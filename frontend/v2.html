<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Google tag (gtag.js) — direct GA4 integration. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-S3CN89KXQQ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-S3CN89KXQQ');
    </script>
    <link rel="icon" type="image/png" href="/favicon.png">
    <title>Supercaly — Find Events Worldwide</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html { overflow-y: scroll; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #08081a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* ── Layout ── */
        .v2-center {
            width: 100%;
            max-width: 600px;
            padding: 2rem;
            text-align: center;
        }

        /* ── Logo (same wordmark as homepage, sized down for the
              Google-style compact layout) ── */
        .logo {
            display: inline-flex;
            align-items: flex-end;
            gap: 0.7rem;
            margin-bottom: 2rem;
            user-select: none;
        }
        .logo-brand {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .logo-subtitle {
            font-size: 0.92rem;
            color: rgba(255,255,255,0.42);
            font-style: italic;
            padding-bottom: 0.45rem;
            line-height: 1;
            white-space: nowrap;
        }
        .logo-mark {
            font-size: 1.55rem;
            color: #7c6af7;
            line-height: 1;
            margin-bottom: 0.15rem;
            filter: drop-shadow(0 0 12px rgba(124,106,247,0.7));
            animation: pulse 3s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { filter: drop-shadow(0 0 8px rgba(124,106,247,0.5)); }
            50%       { filter: drop-shadow(0 0 18px rgba(124,106,247,0.9)); }
        }
        .logo-wordmark {
            font-size: 4rem;
            font-weight: 800;
            letter-spacing: -2.5px;
            line-height: 1;
        }
        .logo-super { color: #ffffff; }
        .logo-caly  { color: #7c6af7; }

        /* ── Search row — pill input + action button side-by-side ── */
        .v2-search-row {
            display: flex;
            gap: 10px;
            align-items: stretch;
            margin-bottom: 0.8rem;
        }
        .v2-search {
            position: relative;
            flex: 1;
            min-width: 0;
        }
        .v2-search-input {
            width: 100%;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.13);
            border-radius: 8px;
            padding: 14px 18px 14px 46px;
            font-size: 1.05rem;
            color: #fff;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }
        .v2-search-input::placeholder { color: rgba(255,255,255,0.3); }
        .v2-search-input:hover {
            background: rgba(255,255,255,0.085);
            border-color: rgba(255,255,255,0.2);
        }
        .v2-search-input:focus {
            border-color: rgba(124,106,247,0.7);
            background: rgba(124,106,247,0.07);
            box-shadow: 0 0 0 4px rgba(124,106,247,0.13);
        }
        .v2-search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1rem;
            color: rgba(255,255,255,0.45);
            pointer-events: none;
        }

        /* City-input pill — same shape, slightly slimmer, hidden by default */
        .v2-city-wrap {
            position: relative;
            margin-bottom: 1rem;
        }
        .v2-city-wrap[hidden] { display: none !important; }
        .v2-city-clear {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(255,255,255,0.3);
            font-size: 1.1rem;
            cursor: pointer;
            padding: 2px 4px;
            line-height: 1;
            transition: color 0.15s;
        }
        .v2-city-clear:hover { color: rgba(255,255,255,0.75); }

        /* ── Dropdowns (identical to homepage so home.js's autocomplete
              renderers drop straight in) ── */
        .suggestions-list {
            position: absolute;
            top: calc(100% + 6px);
            left: 0; right: 0;
            background: #14142a;
            border: 1px solid rgba(255,255,255,0.09);
            border-radius: 14px;
            box-shadow: 0 10px 36px rgba(0,0,0,0.5);
            list-style: none;
            padding: 6px 0;
            z-index: 200;
            overflow: hidden;
            text-align: left;
        }
        .suggestions-list li {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            cursor: pointer;
            font-size: 0.92rem;
            color: rgba(255,255,255,0.8);
            transition: background 0.12s;
        }
        .suggestions-list li:hover,
        .suggestions-list li.active { background: rgba(124,106,247,0.18); }
        .suggestions-list li.metro-option { font-weight: 600; border-bottom: 1px solid rgba(255,255,255,0.07); }
        .suggestions-list li.metro-option:hover,
        .suggestions-list li.metro-option.active { background: rgba(124,106,247,0.28); color: #fff; }
        .suggestions-list li.country-option { font-weight: 600; border-bottom: 1px solid rgba(255,255,255,0.07); color: #6ee7b7; }
        .suggestions-list li.country-option:hover,
        .suggestions-list li.country-option.active { background: rgba(16,185,129,0.2); color: #a7f3d0; }
        .suggestions-list li.state-option { font-weight: 600; border-bottom: 1px solid rgba(255,255,255,0.07); color: #fcd34d; }
        .suggestions-list li.state-option:hover,
        .suggestions-list li.state-option.active { background: rgba(245,158,11,0.2); color: #fde68a; }

        .sugg-badge {
            font-size: 0.6rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.04em;
            padding: 1px 5px; border-radius: 8px; flex-shrink: 0;
        }
        .sugg-badge--category   { background: #1e3a5f; color: #60a5fa; }
        .sugg-badge--event_type { background: #3b1f5e; color: #c084fc; }
        .sugg-badge--performer  { background: #1a3a2a; color: #4ade80; }
        .sugg-badge--venue      { background: #3f1a2e; color: #f472b6; }
        .sugg-badge--genre      { background: #1e1f5e; color: #a5b4fc; }
        .sugg-badge--event      { background: #3a2a1a; color: #fbbf24; }
        .sugg-badge--sport_team { background: #3a1a1a; color: #fb7185; }
        .sugg-badge--theme      { background: #1f3a3a; color: #5eead4; }

        /* ── Geo-location strip ── */
        .v2-geo {
            font-size: 0.92rem;
            color: rgba(255,255,255,0.55);
            margin-bottom: 3rem;
            transition: opacity 0.18s;
        }
        .v2-geo strong { color: rgba(255,255,255,0.88); font-weight: 600; }
        .v2-geo .change-location-link {
            color: #9d8efa;
            text-decoration: none;
            margin-left: 0.55rem;
            cursor: pointer;
            font-weight: 500;
        }
        .v2-geo .change-location-link:hover {
            text-decoration: underline;
            color: #b3a6fc;
        }
        .v2-geo[hidden] { display: none !important; }

        /* ── Action button (sits to the right of the input) ── */
        .v2-btn {
            background: #7c6af7;
            color: #fff;
            border: 1px solid transparent;
            border-radius: 8px;
            padding: 0 16px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.2s, box-shadow 0.2s, transform 0.1s;
            box-shadow: 0 2px 12px rgba(124,106,247,0.28);
        }
        .v2-btn:hover {
            background: #6b58f0;
            box-shadow: 0 3px 16px rgba(124,106,247,0.42);
        }
        .v2-btn:active { transform: scale(0.97); }

        /* ── Footer links ── */
        .home-links {
            display: flex;
            justify-content: center;
            gap: 1.8rem;
        }
        .home-links a {
            color: rgba(255,255,255,0.3);
            text-decoration: none;
            font-size: 0.8rem;
            transition: color 0.2s;
        }
        .home-links a:hover { color: rgba(255,255,255,0.7); }

        /* ── Responsive ── */
        @media (max-width: 560px) {
            .logo-wordmark { font-size: 2.8rem; letter-spacing: -1.2px; }
            .logo-subtitle { font-size: 0.78rem; padding-bottom: 0.32rem; }
            .v2-search-input { padding-left: 42px; font-size: 1rem; }
            .v2-search-icon { left: 14px; }
            .v2-search-row { flex-direction: column; }
            .v2-btn { padding: 12px 18px; font-size: 0.9rem; }
        }
        .v2-geo-hint { opacity: .7; font-weight: normal; }
</style>
</head>
<body>
<div class="v2-center">

    <!-- Logo -->
    <div class="logo">
        <div class="logo-brand">
            <span class="logo-mark">✦</span>
            <div class="logo-wordmark">
                <span class="logo-super">Super</span><span class="logo-caly">caly</span>
            </div>
        </div>
        <p class="logo-subtitle">The Super Calendar</p>
    </div>

    <!-- Search pill + action button (button sits to the right) -->
    <div class="v2-search-row">
        <div class="v2-search">
            <span class="v2-search-icon">🔍</span>
            <input type="text" id="home-type-input" class="v2-search-input"
                   placeholder="Search artist, genre, format…" autocomplete="off" autofocus>
            <ul id="home-type-suggestions" class="suggestions-list" hidden></ul>
        </div>
        <button id="home-search-btn" class="v2-btn" type="button">Supercaly Search</button>
    </div>

    <!-- Geo location strip — default visible, replaced by city input on "change location" -->
    <div class="v2-geo" id="v2-geo">
        Detecting your location…
    </div>

    <!-- City input (hidden by default; revealed by "change location") -->
    <div class="v2-city-wrap" id="v2-city-wrap" hidden>
        <span class="v2-search-icon">📍</span>
        <input type="text" id="home-city-input" class="v2-search-input"
               placeholder="City, country, or metro…" autocomplete="off">
        <button type="button" id="home-city-clear" class="v2-city-clear" hidden>×</button>
        <ul id="home-city-suggestions" class="suggestions-list" hidden></ul>
        <input type="hidden" id="home-city-id">
    </div>

    <!-- Footer links -->
    <div class="home-links">
        <a href="/v2">Classic Homepage</a>
        <a href="/stats.html">📡 Coverage Stats</a>
        <a href="/results.html">Browse</a>
    </div>

</div>

<div id="build-badge" class="build-badge" aria-hidden="true"></div>

<!-- Shared homepage script: handles autocomplete, geo placeholder,
     and the submit → results.html handoff via sessionStorage. The
     element IDs above match what home.js touches so its setup
     functions wire up without modification. -->
<script src="/home.js?v=11"></script>

<!-- v2-specific glue. Adds the "Searching in <city> · change location"
     strip on top of the home.js scaffolding and reveals the city input
     when the user clicks the link. The hidden city input + city-id
     are seeded with the geo-detected location (resolved to a Supercaly
     city / country row) so a default submit — without clicking
     "change location" — lands on the user's city through the existing
     navigateToResults() path in home.js. No changes to that path. -->
<script>
(function() {
    const geoEl    = document.getElementById('v2-geo');
    const cityWrap = document.getElementById('v2-city-wrap');
    const cityIn   = document.getElementById('home-city-input');
    const cityIdIn = document.getElementById('home-city-id');

    function renderGeoLine(label, ok) {
        if (ok) {
            geoEl.innerHTML =
                'Searching events in <strong>' + label + '</strong>' +
                ' <a class="change-location-link" id="v2-change-location">change location</a>';
        } else {
            geoEl.innerHTML =
                "Couldn't detect your location. " +
                '<a class="change-location-link" id="v2-change-location">set a location</a>';
        }
        document.getElementById('v2-change-location').addEventListener('click', (e) => {
            e.preventDefault();
            cityWrap.hidden = false;
            geoEl.hidden = true;
            // Focus + select so the user can immediately overwrite the
            // seeded geo city by typing.
            cityIn.focus();
            try { cityIn.select(); } catch {}
        });
    }

    // ── Location resolution (roadmap #3, 2026-09-21) ──────────────────
    // Order: (1) the city the visitor last searched/accepted (localStorage)
    // → (2) the browser's own position → /api/geo/nearest → (3) IP lookup,
    // but COUNTRY level only. IP geolocation is what used to say "Haifa"
    // to every Israeli visitor (ISP address blocks are registered there),
    // so an IP-derived CITY is never shown as "your location" any more.
    const LS_KEY = 'supercaly_location';

    function loadSaved() {
        try {
            const v = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
            if (v && v.id && v.label && Date.now() - (v.ts || 0) < 180 * 86400e3) return v;
        } catch {}
        return null;
    }
    function save(id, label) {
        try { localStorage.setItem(LS_KEY, JSON.stringify({ id: String(id), label, ts: Date.now() })); } catch {}
    }
    function seed(id, label) {
        cityIn.value   = label;
        cityIdIn.value = String(id);
    }
    // Whatever city the visitor actually submits becomes the remembered one
    // (home.js navigates on submit; the id is in the hidden input by then).
    window.addEventListener('pagehide', () => {
        if (cityIdIn.value && cityIn.value.trim()) save(cityIdIn.value, cityIn.value.trim());
    });

    function browserPosition() {
        return new Promise((resolve) => {
            if (!('geolocation' in navigator)) return resolve(null);
            navigator.geolocation.getCurrentPosition(
                p => resolve({ lat: p.coords.latitude, lon: p.coords.longitude }),
                () => resolve(null),
                { timeout: 6000, maximumAge: 15 * 60e3 });
        });
    }

    (async function() {
        const saved = loadSaved();
        if (saved) {
            seed(saved.id, saved.label);
            renderGeoLine(saved.label, true);
            return;
        }

        // (2) precise: the device's position → our nearest canonical city
        const pos = await browserPosition();
        if (pos) {
            try {
                const r = await fetch(`/api/geo/nearest?lat=${pos.lat.toFixed(4)}&lon=${pos.lon.toFixed(4)}`);
                const near = await r.json();
                if (near && near.id) {
                    const label = near.name + ', ' + near.country;
                    seed(near.id, label);
                    save(near.id, label);
                    renderGeoLine(label, true);
                    return;
                }
            } catch {}
        }

        // (3) IP → country only
        let geo = null;
        try { geo = await (await fetch('/api/geo')).json(); } catch {}
        const geoCountry = ((geo && geo.country_name) || '').trim();
        if (!geoCountry) { renderGeoLine('', false); return; }
        try {
            const countries = await (await fetch('/api/cities/countries')).json();
            const cm = countries.find(c => c.name.toLowerCase() === geoCountry.toLowerCase());
            if (cm) {
                seed('COUNTRY:' + cm.name, cm.name);
                renderGeoLine(cm.name + ' <span class="v2-geo-hint">(set your city for closer results)</span>', true);
                return;
            }
        } catch {}
        cityIn.value = geoCountry;
        renderGeoLine(geoCountry, true);
    })();
})();
</script>
<script src="/build-badge.js?v=1"></script>
</body>
</html>
